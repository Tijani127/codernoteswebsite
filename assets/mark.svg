<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="codernotes">
  <title>codernotes</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7ff0"/>
      <stop offset="1" stop-color="#1452bd"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="0" y="0" width="100" height="100" rx="23.5" fill="url(#badge)"/>

  <!-- note page -->
  <rect x="20.5" y="14.5" width="37.5" height="71" rx="5" fill="#f8fafd"/>

  <!-- folded corner, badge showing through -->
  <path d="M46 14.5 H58 V26.5 Z" fill="#1452bd"/>

  <!-- text lines -->
  <g fill="#6e84a2">
    <rect x="27.5" y="37.5" width="23.5" height="5.2" rx="2.6"/>
    <rect x="27.5" y="52.5" width="16"   height="5.2" rx="2.6"/>
    <rect x="27.5" y="67.5" width="20.5" height="5.2" rx="2.6"/>
  </g>

  <!-- run caret -->
  <path d="M66 37.5 L81.8 50 L66 62.5" fill="none" stroke="#f8fafd" stroke-width="8.8"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
